        // =============================================
        // SIMPLE HASH ROUTER (no dependencies)
        // =============================================
        function useHash() {
            var _s = React.useState(window.location.hash || '#/');
            var hash = _s[0];
            var setHash = _s[1];

            React.useEffect(function () {
                function onHashChange() { setHash(window.location.hash || '#/'); }
                window.addEventListener('hashchange', onHashChange);
                return function () { window.removeEventListener('hashchange', onHashChange); };
            }, []);

            return hash;
        }

        function navigateTo(path) {
            window.location.hash = '#' + path;
        }

        // =============================================
        // LOGIN COMPONENT
        // =============================================
        function Login() {
            var _email = React.useState('');
            var email = _email[0]; var setEmail = _email[1];

            var _pw = React.useState('');
            var password = _pw[0]; var setPassword = _pw[1];

            var _err = React.useState('');
            var error = _err[0]; var setError = _err[1];

            var _ld = React.useState(false);
            var loading = _ld[0]; var setLoading = _ld[1];

            function handleSubmit(ev) {
                ev.preventDefault();
                setError('');
                setLoading(true);
                setTimeout(function () {
                    if (email === 'admin@hitech.edu' && password === 'password123') {
                        localStorage.setItem('hitech_auth', JSON.stringify({
                            user: 'Admin',
                            email: email,
                            role: 'Administrator',
                            loggedInAt: new Date().toISOString()
                        }));
                        navigateTo('/dashboard');
                    } else {
                        setError('Invalid email or password. Please try again.');
                    }
                    setLoading(false);
                }, 1200);
            }

            return ce('div', { className: 'login-page' },
                ce('div', { className: 'login-card' },
                    ce('div', { className: 'login-logo' },
                        ce('div', { className: 'login-logo-icon' }, '\uD83C\uDF93'),

                    ce('p', { className: 'login-subtitle' }, 'Sign in to your learning portal'),

                    ce('form', { onSubmit: handleSubmit },
                        ce('div', { className: 'form-group' },
                            ce('label', { className: 'form-label', htmlFor: 'email' }, 'Email Address'),
                            ce('input', {
                                id: 'email', className: 'form-input', type: 'email',
                                placeholder: 'you@hitech.edu', value: email,
                                onChange: function (ev) { setEmail(ev.target.value); },
                                required: true, autoComplete: 'email'

                        ce('div', { className: 'form-group' },
                            ce('label', { className: 'form-label', htmlFor: 'password' }, 'Password'),
                            ce('input', {

                        ce('button', {

                                                    !p.voided ? ce('button', { className: 'action-btn edit', title: 'Edit', onClick: function () { openEdit('edit-course', p); } }, '\u270F\uFE0F') : null,
                                                    !p.voided ? ce('button', { className: 'action-btn void', title: 'Void', onClick: function () { var v = {}; for (var k in p) v[k] = p[k]; v._voidType = 'course'; openModal('void-confirm', v); } }, '\u26D4') : null,
                                                    ce('button', { className: 'action-btn delete', title: 'Delete', onClick: function () { deleteCoursePayment(p.id); } }, '\uD83D\uDDD1\uFE0F')
                                                )
                                            )
                                        );
                                    })
                                )
                            )
                        )
                    )
                );
            }

            // --- Staff Salaries Tab ---
            function renderStaffSalaries() {
                return ce(React.Fragment, null,
                    ce('div', { className: 'page-header-bar' },
                        ce('div', { className: 'page-stats-row' },
                            ce('span', { className: 'page-stat' }, ce('strong', null, '$' + totalSalaries.toLocaleString()), ' Total'),
                            ce('span', { className: 'page-stat' }, ce('strong', null, staffSalaries.filter(function (s) { return s.role === 'Tutor' && !s.voided; }).length), ' Tutors'),
                            ce('span', { className: 'page-stat' }, ce('strong', null, staffSalaries.filter(function (s) { return s.role === 'Demonstrator' && !s.voided; }).length), ' Demonstrators'),
                            ce('span', { className: 'page-stat' }, ce('strong', null, staffSalaries.filter(function (s) { return s.role === 'Typing Staff' && !s.voided; }).length), ' Typing Staff')
                        ),
                        ce('button', { className: 'page-action-btn', onClick: function () { openAdd('add-salary'); } }, '+ Add Salary')
                    ),
                    ce('div', { className: 'content-card' },
                        ce('div', { className: 'table-wrapper' },
                            ce('table', { className: 'page-table' },
                                ce('thead', null,
                                    ce('tr', null,
                                        ce('th', null, 'ID'),
                                        ce('th', null, 'Name'),
                                        ce('th', null, 'Role'),
                                        ce('th', null, 'Month'),
                                        ce('th', null, 'Amount'),
                                        ce('th', null, 'Status'),
                                        ce('th', null, 'Actions')
                                    )
                                ),
                                ce('tbody', null,
                                    staffSalaries.map(function (s) {
                                        var rowClass = s.voided ? 'voided-row' : '';
                                        var roleColors = { 'Tutor': 'purple', 'Demonstrator': 'info', 'Typing Staff': 'active' };
                                        return ce('tr', { key: s.id, className: rowClass },
                                            ce('td', { className: 'td-id' }, s.id, s.voided ? ce('span', { className: 'void-badge' }, 'VOID') : null),
                                            ce('td', { className: 'td-name' }, s.name),
                                            ce('td', null, ce('span', { className: 'status-badge ' + roleColors[s.role] }, s.role)),
                                            ce('td', null, s.month),
                                            ce('td', { className: 'td-amount' }, '$' + s.amount.toFixed(2)),
                                            ce('td', null, ce('span', { className: 'status-badge ' + (s.status === 'Paid' ? 'active' : 'warning') }, s.status)),
                                            ce('td', null,
                                                ce('div', { className: 'action-btns' },
                                                    !s.voided ? ce('button', { className: 'action-btn edit', title: 'Edit', onClick: function () { openEdit('edit-salary', s); } }, '\u270F\uFE0F') : null,
                                                    !s.voided ? ce('button', { className: 'action-btn void', title: 'Void', onClick: function () { var v = {}; for (var k in s) v[k] = s[k]; v._voidType = 'salary'; openModal('void-confirm', v); } }, '\u26D4') : null,
                                                    ce('button', { className: 'action-btn delete', title: 'Delete', onClick: function () { deleteStaffSalary(s.id); } }, '\uD83D\uDDD1\uFE0F')
                                                )
                                            )
                                        );
                                    })
                                )
                            )
                        )
                    )
                );
            }

            // --- Supplier Payments Tab ---
            function renderSupplierPayments() {
                return ce(React.Fragment, null,
                    ce('div', { className: 'page-header-bar' },
                        ce('div', { className: 'page-stats-row' },
                            ce('span', { className: 'page-stat' }, ce('strong', null, '$' + totalSupplier.toFixed(2)), ' Total'),
                            ce('span', { className: 'page-stat' }, ce('strong', null, supplierPayments.filter(function (s) { return !s.voided; }).length), ' Records')
                        ),
                        ce('button', { className: 'page-action-btn', onClick: function () { openAdd('add-supplier'); } }, '+ Add Payment')
                    ),
                    ce('div', { className: 'content-card' },
                        ce('div', { className: 'table-wrapper' },
                            ce('table', { className: 'page-table' },
                                ce('thead', null,
                                    ce('tr', null,
                                        ce('th', null, 'ID'),
                                        ce('th', null, 'Supplier'),
                                        ce('th', null, 'Item'),
                                        ce('th', null, 'Qty'),
                                        ce('th', null, 'Unit Price'),
                                        ce('th', null, 'Total'),
                                        ce('th', null, 'Date'),
                                        ce('th', null, 'Status'),
                                        ce('th', null, 'Actions')
                                    )
                                ),
                                ce('tbody', null,
                                    supplierPayments.map(function (s) {
                                        var rowClass = s.voided ? 'voided-row' : '';
                                        var total = (s.qty * s.unitPrice).toFixed(2);
                                        return ce('tr', { key: s.id, className: rowClass },
                                            ce('td', { className: 'td-id' }, s.id, s.voided ? ce('span', { className: 'void-badge' }, 'VOID') : null),
                                            ce('td', { className: 'td-name' }, s.supplier),
                                            ce('td', null, s.item),
                                            ce('td', null, s.qty),
                                            ce('td', null, '$' + s.unitPrice.toFixed(2)),
                                            ce('td', { className: 'td-amount' }, '$' + total),
                                            ce('td', null, s.date),
                                            ce('td', null, ce('span', { className: 'status-badge ' + (s.status === 'Paid' ? 'active' : 'warning') }, s.status)),
                                            ce('td', null,
                                                ce('div', { className: 'action-btns' },
                                                    !s.voided ? ce('button', { className: 'action-btn edit', title: 'Edit', onClick: function () { openEdit('edit-supplier', s); } }, '\u270F\uFE0F') : null,
                                                    !s.voided ? ce('button', { className: 'action-btn void', title: 'Void', onClick: function () { var v = {}; for (var k in s) v[k] = s[k]; v._voidType = 'supplier'; openModal('void-confirm', v); } }, '\u26D4') : null,
                                                    ce('button', { className: 'action-btn delete', title: 'Delete', onClick: function () { deleteSupplierPayment(s.id); } }, '\uD83D\uDDD1\uFE0F')
                                                )
                                            )
                                        );
                                    })
                                )
                            )
                        )
                    )
                );
            }

            // ====== TABS CONFIG ======
            var tabs = [
                { key: 'course', icon: '\uD83C\uDF93', label: 'Course Payments' },
                { key: 'salary', icon: '\uD83D\uDC65', label: 'Staff Salaries' },
                { key: 'supplier', icon: '\uD83D\uDCE6', label: 'Supplier Payments' }
            ];

            // ====== MODAL TITLES ======
            var modalTitles = {
                'add-course': '\uD83D\uDCB3 Record Course Payment',
                'edit-course': '\u270F\uFE0F Edit Course Payment',
                'add-salary': '\uD83D\uDCB0 Add Staff Salary',
                'edit-salary': '\u270F\uFE0F Edit Staff Salary',
                'add-supplier': '\uD83D\uDCE6 Add Supplier Payment',
                'edit-supplier': '\u270F\uFE0F Edit Supplier Payment',
                'receipt': '\uD83E\uDDFE Payment Receipt',
                'void-confirm': '\u26D4 Void Record'
            };

            return ce(DashboardLayout, {
                currentRoute: '/finance',
                pageTitle: 'Finance Management',
                pageSubtitle: 'Manage payments, salaries, and supplier invoices.'
            },
                // Tab Navigation
                ce('div', { className: 'finance-tabs' },
                    tabs.map(function (tab) {
                        return ce('button', {
                            key: tab.key,
                            className: 'finance-tab' + (activeTab === tab.key ? ' active' : ''),
                            onClick: function () { setActiveTab(tab.key); }
                        }, ce('span', { className: 'tab-icon' }, tab.icon), ' ', tab.label);
                    })
                ),

                // Tab Content
                activeTab === 'course' ? renderCoursePayments() : null,
                activeTab === 'salary' ? renderStaffSalaries() : null,
                activeTab === 'supplier' ? renderSupplierPayments() : null,

                // Modal
                ce(Modal, {
                    open: modal.open,
                    title: modalTitles[modal.type] || '',
                    onClose: closeModal,
                    size: modal.type === 'receipt' ? 'modal-receipt' : ''
                }, renderModalContent())
            );
        }

        // =============================================
        // HELPDESK PAGE
        // =============================================
        function HelpdeskPage() {
            var tickets = [
                { id: 'TKT-401', subject: 'Cannot access course materials', requester: 'Sarah Chen', priority: 'High', status: 'Open', created: '2 hours ago' },
                { id: 'TKT-400', subject: 'Payment failed but amount deducted', requester: 'Carlos Rodriguez', priority: 'Urgent', status: 'In Progress', created: '3 hours ago' },
                { id: 'TKT-399', subject: 'Certificate not generated', requester: 'Yuki Tanaka', priority: 'Medium', status: 'Open', created: '5 hours ago' },
                { id: 'TKT-398', subject: 'Video playback issues', requester: 'Emily Davis', priority: 'Low', status: 'Open', created: '1 day ago' },
                { id: 'TKT-397', subject: 'Need to change enrolled course', requester: 'Michael Brown', priority: 'Medium', status: 'In Progress', created: '1 day ago' },
                { id: 'TKT-396', subject: 'Login issues with new device', requester: 'Aisha Patel', priority: 'High', status: 'Resolved', created: '2 days ago' },
                { id: 'TKT-395', subject: 'Request for transcript', requester: 'James Wilson', priority: 'Low', status: 'Resolved', created: '2 days ago' },
                { id: 'TKT-394', subject: 'Exam date conflict', requester: 'Olivia Johnson', priority: 'High', status: 'Closed', created: '3 days ago' }
            ];

            var priorityColors = { 'Urgent': 'danger', 'High': 'warning', 'Medium': 'info', 'Low': 'active' };
            var statusColors = { 'Open': 'warning', 'In Progress': 'info', 'Resolved': 'active', 'Closed': 'purple' };

            return ce(DashboardLayout, {
                currentRoute: '/helpdesk',
                pageTitle: 'Helpdesk',
                pageSubtitle: 'Manage support tickets and student requests.'
            },
                ce('div', { className: 'page-header-bar' },
                    ce('div', { className: 'page-stats-row' },
                        ce('span', { className: 'page-stat' }, ce('strong', null, '12'), ' Open'),
                        ce('span', { className: 'page-stat' }, ce('strong', null, '5'), ' In Progress'),
                        ce('span', { className: 'page-stat' }, ce('strong', null, '234'), ' Resolved')
                    ),
                    ce('button', { className: 'page-action-btn' }, '+ New Ticket')
                ),
                ce('div', { className: 'ticket-grid' },
                    tickets.map(function (t) {
                        return ce('div', { className: 'ticket-card', key: t.id },
                            ce('div', { className: 'ticket-card-header' },
                                ce('span', { className: 'td-id' }, t.id),
                                ce('span', { className: 'status-badge ' + statusColors[t.status] }, t.status)
                            ),
                            ce('h3', { className: 'ticket-subject' }, t.subject),
                            ce('div', { className: 'ticket-meta' },
                                ce('span', null, '\uD83D\uDC64 ' + t.requester),
                                ce('span', { className: 'status-badge ' + priorityColors[t.priority] }, t.priority)
                            ),
                            ce('div', { className: 'ticket-time' }, '\uD83D\uDD52 ' + t.created)
                        );
                    })
                )
            );
        }

        // =============================================
        // SETTINGS PAGE
        // =============================================
        function SettingsPage() {
            var auth = JSON.parse(localStorage.getItem('hitech_auth') || '{}');

            return ce(DashboardLayout, {
                currentRoute: '/settings',
                pageTitle: 'Settings',
                pageSubtitle: 'Manage your account and preferences.'
            },
                // Profile Section
                ce('div', { className: 'content-card settings-section' },
                    ce('h3', { className: 'settings-section-title' }, '\uD83D\uDC64 Profile Information'),
                    ce('div', { className: 'settings-grid' },
                        ce('div', { className: 'settings-field' },
                            ce('label', { className: 'form-label' }, 'Full Name'),
                            ce('input', { className: 'form-input', type: 'text', defaultValue: auth.user || 'Admin', readOnly: true })
                        ),
                        ce('div', { className: 'settings-field' },
                            ce('label', { className: 'form-label' }, 'Email Address'),
                            ce('input', { className: 'form-input', type: 'email', defaultValue: auth.email || 'admin@hitech.edu', readOnly: true })
                        ),
                        ce('div', { className: 'settings-field' },
                            ce('label', { className: 'form-label' }, 'Role'),
                            ce('input', { className: 'form-input', type: 'text', defaultValue: auth.role || 'Administrator', readOnly: true })
                        ),
                        ce('div', { className: 'settings-field' },
                            ce('label', { className: 'form-label' }, 'Phone'),
                            ce('input', { className: 'form-input', type: 'tel', defaultValue: '+1 (555) 123-4567', readOnly: true })
                        )
                    )
                ),

                // Notifications Section
                ce('div', { className: 'content-card settings-section' },
                    ce('h3', { className: 'settings-section-title' }, '\uD83D\uDD14 Notification Preferences'),
                    ce('div', { className: 'settings-toggle-list' },
                        ['Email Notifications', 'Push Notifications', 'SMS Alerts', 'Weekly Digest'].map(function (label, i) {
                            return ce('div', { className: 'settings-toggle-row', key: 'n' + i },
                                ce('span', null, label),
                                ce('div', { className: 'toggle-switch' + (i < 2 ? ' on' : '') },
                                    ce('div', { className: 'toggle-knob' })
                                )
                            );
                        })
                    )
                ),

                // Appearance Section
                ce('div', { className: 'content-card settings-section' },
                    ce('h3', { className: 'settings-section-title' }, '\uD83C\uDFA8 Appearance'),
                    ce('div', { className: 'settings-toggle-list' },
                        ['Dark Mode', 'Compact Sidebar', 'Animations'].map(function (label, i) {
                            return ce('div', { className: 'settings-toggle-row', key: 'a' + i },
                                ce('span', null, label),
                                ce('div', { className: 'toggle-switch' + (i === 0 || i === 2 ? ' on' : '') },
                                    ce('div', { className: 'toggle-knob' })
                                )
                            );
                        })
                    )
                )
            );
        }

        // =============================================
        // APP — uses custom hash routing
        // =============================================
        function App() {
            var hash = useHash();
            var isAuthenticated = !!localStorage.getItem('hitech_auth');
            var route = hash.replace('#', '') || '/';

            if (!isAuthenticated) {
                return ce(Login, null);
            }

            switch (route) {
                case '/dashboard': return ce(DashboardPage, null);
                case '/students': return ce(StudentsPage, null);
                case '/courses': return ce(CoursesPage, null);
                case '/exams': return ce(ExamsPage, null);
                case '/finance': return ce(FinancePage, null);
                case '/helpdesk': return ce(HelpdeskPage, null);
                case '/settings': return ce(SettingsPage, null);
                default: return ce(DashboardPage, null);
            }
        }

        // ---- Mount ----
        var rootEl = document.getElementById('root');
        var root = ReactDOM.createRoot(rootEl);
        root.render(ce(App, null));
    </script>
</body>

</html>
